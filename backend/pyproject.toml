[project]
name = "opticare-backend"
version = "0.1.0"
description = "OptiCare backend: intake, scoring, planner, notifications"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "geoalchemy2>=0.21.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
