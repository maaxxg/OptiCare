name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        # Keep in sync with docker-compose.yml.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: opticare
          POSTGRES_PASSWORD: opticare
          POSTGRES_DB: opticare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opticare -d opticare"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      RUN_DB_TESTS: "1"
      DATABASE_URL: postgresql+psycopg://opticare:opticare@localhost:5432/opticare
      PGPASSWORD: opticare
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Keep in sync with backend/Dockerfile.
          version: "0.13.8"
          python-version-file: backend/.python-version
      - run: uv sync --frozen
      # Same as db/init/01-postgis.sql under docker compose.
      - run: psql -h localhost -U opticare -d opticare -c "CREATE EXTENSION IF NOT EXISTS postgis;"
      - run: uv run python check.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:all
