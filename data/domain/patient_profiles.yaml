# Profili izmišljenih pacijenata (E13-T1, KAN-87). Ulaz za E1-T3 (početni podaci za demo).
# SVE JE SINTETIČKO: imena su izmišljena, MBO i telefoni očito lažni, bez ulica i kućnih brojeva.
# Naselja i općine su javna geografija Ličko-senjske županije; koordinate postavlja E1-T3.
#
# expected_transport_entitlement je OČEKIVANI PRIJEDLOG sustava, ne činjenica; pravo utvrđuje
# izabrani liječnik (pravilo 8). Heuristika za nacrt: nepokretan ili teško pokretan -> sanitetski;
# upućen izvan mjesta prebivališta -> putni nalog; inače ništa.
# REVIEW: potvrditi heuristiku s osobom iz prakse (E13-T4 [S] će opisati pravila HZZO-a).
#
# earliest_offset_days / latest_offset_days: dani od datuma demo plana (0 = plan dana, 1 = "sutra").
# Raspon ne smije biti veći od max_shift_days klase hitnosti.
# social_order_today: pokretan pacijent koji bi DANAS vjerojatno dobio nalog za sanitetski prijevoz
#   iz socijalnih razloga (plan, E1-T3); sustav ga ne šalje na sanitetsko vozilo (pravilo 7).
# Destinacije: ob_gospic, kbc_rijeka, kbc_zagreb (REVIEW: konkretna zagrebačka bolnica je nagađanje).

