# Parametri generatora sintetičkih povijesnih vožnji (E1-T4, KAN-16).
# Ulaz za treniranje modela trajanja pregleda i vremena ukrcaja (E4).
# SINTETIČKI NACRT: sve vrijednosti su procjene; domenski član tima (DOM) ih pregledava.
#
# Osnovna trajanja pregleda (median_min i p90_min) te osnovno vrijeme ukrcaja (boarding_time_min)
# čitaju se izravno iz `urgency_and_durations.yaml`, kako bi oba mjesta koristila iste brojeve.
# Trajanje se uzorkuje iz log-normalne raspodjele određene medijanom i 90. percentilom.

default_count: 3000          # broj povijesnih vožnji (nekoliko tisuća redaka)
history_days: 180            # raspon u prošlost (dani)
random_seed: 42

# Udjeli vrsta pregleda u povijesnim vožnjama (zbroj ne mora biti 1; normalizira se u kodu).
# REVIEW: odražava li omjer tipičnu potražnju (dijaliza 3x tjedno + kontrole čine glavninu vožnji)?
visit_mix:
  - {department: dialysis,          visit_type: dialysis_session, weight: 22}
  - {department: internal_medicine, visit_type: follow_up,        weight: 10}
  - {department: internal_medicine, visit_type: first_visit,      weight: 5}
  - {department: internal_medicine, visit_type: procedure_test,   weight: 4}
  - {department: cardiology,        visit_type: follow_up,        weight: 9}
  - {department: cardiology,        visit_type: first_visit,      weight: 4}
  - {department: cardiology,        visit_type: procedure_test,   weight: 5}
  - {department: ophthalmology,     visit_type: follow_up,        weight: 7}
  - {department: ophthalmology,     visit_type: first_visit,      weight: 4}
  - {department: ophthalmology,     visit_type: procedure_test,   weight: 3}
  - {department: orthopaedics,      visit_type: follow_up,        weight: 6}
  - {department: orthopaedics,      visit_type: first_visit,      weight: 3}
  - {department: orthopaedics,      visit_type: procedure_test,   weight: 2}
  - {department: neurology,         visit_type: follow_up,        weight: 5}
  - {department: neurology,         visit_type: first_visit,      weight: 3}
  - {department: neurology,         visit_type: procedure_test,   weight: 3}
  - {department: radiology,         visit_type: procedure_test,   weight: 8}
  - {department: oncology,          visit_type: follow_up,        weight: 5}
  - {department: oncology,          visit_type: first_visit,      weight: 2}
  - {department: oncology,          visit_type: procedure_test,   weight: 4}

# Udjeli klasa pokretljivosti u povijesnim vožnjama.
# REVIEW: udjeli po pokretljivosti u Ličko-senjskoj županiji.
mobility_weights:
  walks: 0.40
  cane: 0.30
  wheelchair: 0.20
  stretcher: 0.10

# Raspodjela vremena ukrcaja (od dolaska pred vrata do polaska vozila, u minutama).
# Medijan dolazi iz `urgency_and_durations.yaml -> boarding_time_min` (3, 5, 10, 15 min).
# REVIEW: 90. percentil i dodatak po katu bez lifta.
boarding:
  p90_min:
    walks: 5
    cane: 9
    wheelchair: 16
    stretcher: 24
  extra_min_per_floor_no_elevator:
    walks: 0.5
    cane: 1.5
    wheelchair: 3.5
    stretcher: 5.0
  # REVIEW: pratnja malo skraćuje ukrcaj (0.90 = 10% brže).
  companion_factor: 0.90
  min_minutes: 1.0

# Trajanje pregleda u ustanovi: dodatni utjecaj dobi i najmanje dopušteno trajanje (u minutama).
visit_duration:
  # REVIEW: pacijenti od 75 i više godina u prosjeku trebaju malo više vremena (1.08 = 8% duže).
  age_over_75_factor: 1.08
  min_minutes: 10.0

# Kontekst pacijenta u povijesnim vožnjama (dob, kat, lift, pratnja).
# U Ličko-senjskoj županiji 26-28% stanovništva ima 65+ godina (DZS Popis 2021).
patient_context:
  age_min: 45
  age_max: 92
  age_mode: 74
  floor_weights:             # 0 = prizemlje/kuća (većina u Lici), 1-4 = katovi u zgradama
    0: 0.70
    1: 0.14
    2: 0.09
    3: 0.05
    4: 0.02
  elevator_prob_if_upper_floor: 0.25   # vjerojatnost lifta za kat >= 1; prizemlje nema lift
  companion_prob_by_mobility:
    walks: 0.15
    cane: 0.35
    wheelchair: 0.65
    stretcher: 0.80

# Početak vožnje (dolazak pred vrata) unutar dana, po zagrebačkom lokalnom vremenu.
# Sati od earliest_hour do latest_hour (uključivo), minute u koracima minute_step: 06:00 do 11:50.
# REVIEW: stvarni raspored jutarnjih polazaka (dijaliza obično rano ujutro).
start_window:
  earliest_hour: 6
  latest_hour: 11
  minute_step: 10

# Cestovna udaljenost u jednom smjeru (km) i prosječna brzina za izračun vremena vožnje.
# Stvarne udaljenosti do OB Gospić: Smiljan/Lički Osik/Perušić 6-15 km, Otočac/Udbina/Korenica 45-57 km,
# Donji Lapac 75-80 km, Novalja/Senj ~85-87 km; do KBC Rijeka / KBC Zagreb 110-215 km.
# OB Gospić ima sve odjele osim onkologije; onkologija ide u KBC (vanjski pojas).
drive:
  mean_speed_kmh: 55.0
  # Faktor kojim se množi vrijeme vožnje (promet, cesta, godišnje doba).
  # REVIEW: raspon varijacije brzine.
  speed_jitter: {min: 0.9, max: 1.2}
  min_drive_min: 5.0           # najkraće vrijeme vožnje u jednom smjeru (minute)
  # Čekanje vozila nakon pregleda prije povratka kući (minute).
  # REVIEW: tipično čekanje na povratak.
  return_wait_min: {min: 5.0, max: 20.0}
  # Odjeli koji uvijek idu u vanjsku ustanovu (KBC) i koriste samo vanjski pojas.
  external_departments: [oncology]
  external_band_km: {min: 110.0, max: 220.0}   # KBC Rijeka i KBC Zagreb
  # Ostali odjeli biraju samo među ovim pojasevima, prema težini.
  distance_bands_km:
    local:     {min: 3.0,  max: 18.0, weight: 0.35}  # Gospić, Smiljan, Lički Osik, Perušić
    regional:  {min: 18.0, max: 90.0, weight: 0.50}  # Otočac, Udbina, Korenica, D. Lapac, Senj, Novalja
