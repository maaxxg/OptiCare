# Primjeri rečenica pacijenata s očekivanim izdvajanjem (E13-T5). Ulaz za E2-T4.
# Izvor: dokument domenske članice tima (50 rečenica), očišćen i dopunjen:
#   - izbačeni gotovo duplikati, ispravljene pogreške i proturječja (vidi `source` i komentare)
#   - dio primjera prepisan u neuređen govor (izmiješan redoslijed, ispravci, razgovorni izrazi)
#   - dodani primjeri s djelatnošću, hitnošću, datumom, dijelom dana, telefonom, katom i liftom,
#     pacijentom-vozačem, privolom za zajedničku vožnju, MBO-om i podacima koji nedostaju
# SVE JE SINTETIČKO: imena su izmišljena, MBO i telefoni očito lažni, nema ulica.
#
# PRAVILA ZA OČEKIVANE VRIJEDNOSTI
# - Polje koje NIJE navedeno u `expected` znači: u tekstu nije rečeno. Izdvajanje mora vratiti null
#   i staviti polje na popis "za provjeru" (pravilo 5: ne pogađa se).
# - `review`: polja kojima je vrijednost zadana, ali je nesigurna; izdvajanje ih mora i označiti.
# - `mbo_in_text`: MBO izgovoren u tekstu. Uklanja se PRIJE poziva LLM-a (pravilo 3); test provjerava
#   da tekst poslan LLM-u ne sadrži te znamenke. MBO nije polje koje LLM izdvaja.
# - Uvijek se izdvajaju podaci PACIJENTA, i kad zove netko drugi (kći, supruga, susjeda).
# - `reference_date` je "danas" za izračun godine rođenja i datuma ("osamnaestog", "ovaj tjedan").
#
# ZNAČENJE POLJA (kako ih procjenjuje skripta iz E2-T4)
# - birth_year: reference_date.year minus navršene godine; skripta prihvaća odstupanje ±1.
#   "Meni je sedamdeset četvrta godina" znači 73 navršene godine.
# - settlement: mjesto kako je rečeno (normalizirano ime naselja). Općinu i županiju daje
#   geokodiranje (E2-T3), ne LLM, pa nisu ovdje. "Selo kod X" -> settlement X + review.
# - lives_alone: živi sam u kućanstvu. "Živimo sami, nas dvoje" -> false.
# - companion: netko ide s pacijentom na OVAJ pregled.
# - own_car: pacijent ima auto kojim SAM može doći na ovaj pregled. Auto u kvaru ili zabrana
#   vožnje -> false (uz review kad auto postoji, ali se ne smije voziti).
# - mobility_class: walks, cane (štap, štake, hodalica), wheelchair, stretcher (leži, nosila).
# - carpool_driver_seats: koliko drugih pacijenata vozač nudi povesti; carpool_rider_consent:
#   pacijent pristaje ići s drugim pacijentom-vozačem.
# - missed_visits_last_year: propušteni pregledi u zadnjih 12 mjeseci ("lani", "ove godine",
#   "prošle godine" se broje). Broj bez vremenskog okvira -> vrijednost + review.
# - phone_type: landline (kućni/fiksni), basic_mobile (mobitel na tipke), smartphone.
# - department, visit_type, urgency_class: ključevi iz urgency_and_durations.yaml.
#   "Specijalist" bez djelatnosti -> department null.
# - preferred_time_of_day: morning ili afternoon.   # REVIEW: vrijednosti još nisu u šifrarniku
# - recurrence: npr. 3x_weekly (kao u patient_profiles.yaml).
# - earliest_date / latest_date: samo kad je datum ili rok izričito rečen.

reference_date: 2026-11-16   # ponedjeljak

