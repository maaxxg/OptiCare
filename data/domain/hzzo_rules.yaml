# Pravila HZZO-a za prijevoz na liječenje (E13-T4). Ulaz za E3-T2 (provjera prava na prijevoz).
#
# Sažetak propisa, ne pravni savjet. Stanje prema izvorima na dnu datoteke (pregledano 14. 11. 2026.).
# Rezultat provjere je uvijek PRIJEDLOG: pravo utvrđuje izabrani liječnik (pravilo 8).
# Ništa ovdje ne smije ukloniti ili zapostaviti pacijenta (pravilo 1); "none" znači samo da HZZO
# vjerojatno ne plaća prijevoz, a sustav i dalje traži prijevoz (Crveni križ, općina, zajednička vožnja).
#
# Redoslijed provjere: 1) sanitetski prijevoz, 2) putni nalog, 3) ništa.

sanitetski:
  # Pravilnik o sanitetskom prijevozu (NN 123/09), čl. 2.: pravo ima osigurana osoba koja je
  # nepokretna, teško pokretna ili "kojoj zbog prirode bolesti nije preporučeno samostalno kretanje".
  # Dijagnoza ili terapija (dijaliza, kemoterapija) NIJE sama po sebi uvjet; takvi pacijenti
  # imaju putni nalog bez obzira na udaljenost (vidi travel_order.distance_exceptions).
  legal_criteria:
    - nepokretna osoba
    - teško pokretna osoba
    - osoba kojoj zbog prirode bolesti nije preporučeno samostalno kretanje
  # Preslikavanje klase pokretljivosti na prijedlog sustava.
  by_mobility_class:
    stretcher: candidate          # nepokretan
    wheelchair: candidate         # nepokretan ili teško pokretan
    cane: doctor_judgement        # "teško pokretan" procjenjuje liječnik; sustav ne odlučuje sam
    walks: not_candidate          # osim ako liječnik ocijeni da mu se ne preporučuje samostalno kretanje
  # doctor_judgement: sustav računa prijedlog kao da nema prava na sanitet (dakle putni nalog ili
  # ništa) i označava sestri/liječniku "provjeriti pravo na sanitetski prijevoz".
  issued_by:                      # Pravilnik NN 123/09, čl. 4.
    - who: izabrani doktor primarne zdravstvene zaštite
      when: prijevoz od kuće do ugovorne ustanove (slučaj koji obrađuje naš sustav)
    - who: doktor u službi hitne medicine
      when: hitni slučajevi
    - who: doktor ugovorne zdravstvene ustanove u kojoj se pacijent liječi
      when: povratak iz ustanove kući i premještaj između ustanova
    - who: ovlašteni doktor HZZO-a
      when: prijevoz u inozemstvo i povratak

travel_order:
  # Zakon o obveznom zdravstvenom osiguranju (ZOZO), čl. 62. i 65., u tekstu na snazi od 1. 8. 2025.
  # Svi uvjeti moraju vrijediti:
  conditions:
    - ne ispunjava uvjete za sanitetski prijevoz
    - upućen je u drugo mjesto u odnosu na mjesto prebivališta ili boravišta
    - upućen je najbližem ugovornom subjektu koji pruža tu vrstu zdravstvene zaštite
    - ugovorni subjekt je udaljen 50 i više km od adrese prebivališta ili boravišta (osim iznimaka)
  min_distance_km: 50
  distance:
    # Od 1. 8. 2025.: najkraća cestovna relacija od ADRESE prebivališta do ADRESE ugovornog
    # subjekta, prema interaktivnoj karti HAK-a (ZOZO čl. 65. st. 1. i 6.).
    # Do 31. 7. 2025. računalo se od kolodvora do kolodvora prema daljinomjeru javnog prijevoznika.
    official_source: interaktivna karta HAK-a
    # HAK karta nema API: sustav računa cestovnu udaljenost preko adaptera za rute (ORS),
    # što je približno. Rubne slučajeve označava sestri umjesto da odluči sam.
    system_source: route_adapter
    # Pojas od ±5 km (oko 10 %) pokriva poznata odstupanja: u slučaju iz Novog lista HAK je dao
    # 49,83 km, a Google 53,1 km (razlika 3,3 km). HAK mjeri NAJKRAĆU relaciju, a ruteri po
    # zadanom vraćaju NAJBRŽU, koja je često dulja (OSRM, Otočac -> OB Gospić: 57 km autocestom).
    # Zato adapter treba tražiti najkraću rutu (ORS: preference=shortest).
    borderline_band_km: [45, 55]
    on_borderline: flag           # "provjeriti udaljenost na HAK karti"
    on_unknown: flag              # bez udaljenosti nema prijedloga; nikad se ne nagađa (pravilo 5)
  place:
    # ZOZO čl. 65. st. 4. i 5. (NN 105/2025): "mjesto" je grad ili naselje izvan grada. Naselje u
    # sastavu grada računa se kao zasebno mjesto ako je od grada udaljeno 20 i više km.
    separate_if_km_from_town: 20
  nearest_provider:
    # Pravo vrijedi prema najbližem ugovornom subjektu s tom djelatnošću (ZOZO čl. 62. st. 2.).
    # U sustavu: najbliža ustanova (Facility) koja ima traženi odjel (department).
    rule: nearest_facility_with_department
    # Iznimke koje sustav ne može sam utvrditi, pa ih sestra označava ručno:
    manual_overrides:
      - "Pacijent je prihvatio udaljeniju ustanovu radi kraće liste čekanja (čl. 62. st. 5.): pravo ostaje."
      - Bliža ustanova ne može pružiti skrb u primjerenom roku s obzirom na zdravstveno stanje.
        (Pravilnik NN 37/2026, čl. 75. st. 1. t. 3. i st. 2.-3.; za malignu i hematološku bolest
        najdulje prihvatljivo čekanje je četiri tjedna.)
      - U najbližem mjestu nema ugovorene djelatnosti za odgovarajuću zaštitu, npr. subspecijalistički
        pregled (Pravilnik NN 37/2026, čl. 75. st. 1. t. 2.).
    # Pacijent koji SAM bira udaljeniju ustanovu nema pravo na naknadu ni na sanitet (čl. 62. st. 6.).
  distance_exceptions:
    # ZOZO čl. 62. st. 4.: pravo na naknadu neovisno o udaljenosti.
    - key: under_18
      label: osigurana osoba do 18. godine života
      system_check: birth_year
    - key: radiotherapy_chemotherapy
      label: radioterapija i kemoterapija
      # Ne vrijedi za onkologiju općenito: onkološka kontrola nije kemoterapija ni radioterapija.
      # Odjel (department: oncology) nije dovoljan; odlučuje vrsta pregleda (odluka tima 14. 11. 2026.).
      system_check: visit_type in [chemotherapy, radiotherapy]
    - key: hemodialysis
      label: hemodijaliza kao kronični bubrežni bolesnik
      system_check: visit_type == dialysis_session
    - key: work_injury
      label: priznata ozljeda na radu ili profesionalna bolest
      system_check: manual_flag
    - key: organ_donor
      label: darivatelj organa, tkiva ili stanica
      system_check: manual_flag
    - key: art_12
      label: osigurana osoba iz čl. 12. st. 2. i 3. ZOZO-a
      system_check: manual_flag
    - key: treatment_abroad
      label: upućen na liječenje u inozemstvo
      system_check: out_of_scope
  compensation:
    # ZOZO čl. 65. st. 1.: 0,025 % proračunske osnovice po km najkraće cestovne relacije,
    # neovisno o prijevoznom sredstvu (autobus, vlak, vlastiti automobil).
    rate: "0,025 % proračunske osnovice po km"
    # Proračunska osnovica je 441,44 € i 2025. i 2026.: 0,025 % = 0,1104 €/km. Provjeriti svake
    # godine u zakonu o izvršavanju državnog proračuna.
    approx_eur_per_km: 0.11
    # Pravilnik NN 37/2026, čl. 75. st. 5.: naknada se isplaćuje "u dvostrukom iznosu" za najkraću
    # udaljenost od adrese do ustanove, dakle za oba smjera. Udaljenost se utvrđuje na dan obrade
    # zahtjeva prema HAK karti (st. 6.). Isti iznos dobiva i pratnja koju je odredio liječnik (čl. 79.).
    round_trip: true
  issued_by:
    # ZOZO čl. 65.: tiskanicu putnog naloga izdaje izabrani doktor medicine primarne zdravstvene
    # zaštite (ili izabrani doktor dentalne medicine), a ovlašteni radnik HZZO-a kad poziva HZZO.
    - izabrani doktor primarne zdravstvene zaštite
  # Hemodijaliza (Pravilnik NN 37/2026, čl. 83.-84.): bolesnik bez prava na sanitet dobiva mjesečnu
  # paušalnu naknadu (dvostruka najniža cijena mjesečne pokazne karte) ako je ustanova udaljena
  # 500 m ili više. Isplaćuje se na temelju potvrde ustanove o broju dijaliza u prethodnom mjesecu,
  # bez putnog naloga. Ako je dijaliza izvan mjesta prebivališta, uz paušal ide i naknada po km
  # iz ZOZO čl. 65. st. 1. Za sanitet na dijalizu postoji posebna tiskanica (čl. 14. st. 7.).

# Što sustav priprema (E3-T2): prijedlog prava, razlog u jednoj rečenici, udaljenost i njen izvor,
# primijenjenu iznimku i popis oznaka za sestru. Ne ispisuje stvarnu tiskanicu.

